name: Publish NuGet

# Runs on GitHub-hosted runners on purpose. This repository is public, so
# hosted Actions minutes are free and a self-hosted runner must never be
# attached to it: a fork pull request would execute arbitrary code on that
# machine.

on:
  push:
    tags:
      - 'v*'

  # Version Increment pushes its tag using GITHUB_TOKEN, and events created
  # with that token deliberately do not start other workflows, so the tag
  # push above never fires for an automated release. workflow_run is not a
  # token-created event: it fires when the other workflow finishes, so the
  # release path reaches here without a stored PAT.
  #
  # Kept as a trigger on this file rather than a reusable workflow called
  # from Version Increment, because the Trusted Publisher policy is bound to
  # this workflow's file name.
  workflow_run:
    workflows: ["Version Increment"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build (e.g. 0.1.2). Leave empty to derive from the latest Git tag.'
        required: false
        type: string
      publish:
        description: 'Push the package to nuget.org'
        required: true
        default: false
        type: boolean

jobs:
  pack:
    # Pinned to VS 2022 deliberately. The native library shipped inside the
    # package links the dynamic CRT, so its toolset sets the minimum
    # Visual C++ Redistributable every consumer's machine must carry.
    # windows-latest is now windows-2025-vs2026, which would silently raise
    # that floor for every downstream deployment.
    runs-on: windows-2022

    # workflow_run fires whatever the outcome of the run that triggered it,
    # so a failed Version Increment must not reach the publisher.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      # Required for NuGet Trusted Publishing: the job mints a short-lived
      # OIDC token that nuget.org exchanges for a temporary API key. No
      # long-lived secret is stored in this repository.
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the commit the triggering run used.
          # The default would be the branch tip, which may already have moved.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          # Version is derived from the Git tag, so the full history and all
          # tags must be present.
          fetch-depth: 0
          fetch-tags: true

      # One place decides whether this run publishes, so the three steps
      # below cannot drift apart. A tag push and a completed Version
      # Increment both publish; a manual dispatch publishes only when asked.
      - name: Decide whether to publish
        id: gate
        shell: pwsh
        run: |
          $publish =
            '${{ github.event_name }}' -eq 'workflow_run' -or
            '${{ github.ref }}'.StartsWith('refs/tags/v') -or
            '${{ inputs.publish }}' -eq 'true'
          Write-Host "event=${{ github.event_name }} ref=${{ github.ref }} publish=$publish"
          "publish=$($publish.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

      # The version is derived with `git describe --tags --abbrev=0`, which
      # returns the nearest *ancestor* tag. On a branch that has moved past
      # its last tag that silently produces a package claiming a version its
      # source no longer corresponds to. Publishing therefore requires HEAD
      # to sit exactly on a tag, unless a version is passed explicitly.
      #
      # This is not hypothetical: 0.1.1 was published from a main that was
      # six commits ahead of the v0.1.1 tag.
      - name: Require HEAD to be exactly at a tag
        if: steps.gate.outputs.publish == 'true' && inputs.version == ''
        shell: pwsh
        run: |
          $tag = git describe --exact-match --tags HEAD 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $tag) {
            $near = git describe --tags --abbrev=0 2>$null
            throw @"
HEAD is not at a tag, so the derived version would be wrong.
The nearest ancestor tag is '$near', but this commit is not that release.

Either push a new tag for this commit, or re-run this workflow with an
explicit version input to publish deliberately.
"@
          }
          Write-Host "Publishing from tag $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure native build
        run: cmake -B build -DBUILD_TESTS=OFF -DBUILD_E2E_TESTS=OFF -DENABLE_COVERAGE=OFF

      - name: Build native WinDevices.dll
        run: cmake --build build --config Release --parallel

      - name: Verify native artifact exists
        shell: pwsh
        run: |
          $dll = 'build/bin/Release/WinDevices.dll'
          if (-not (Test-Path $dll)) { throw "Native library not produced at $dll" }
          Write-Host "Native library: $((Get-Item $dll).Length) bytes"

      - name: Pack
        shell: pwsh
        run: |
          $args = @('pack', 'dotnet/WinDevicesNet/WinDevicesNet.csproj', '-c', 'Release', '-o', 'artifacts')
          if ('${{ inputs.version }}') { $args += "-p:PackageVersionOverride=${{ inputs.version }}" }
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw 'dotnet pack failed' }

      # A package that is missing the native library restores cleanly and
      # then fails at the consumer's first P/Invoke. Fail here instead.
      - name: Verify package layout
        shell: pwsh
        run: |
          # Match on the extension rather than a wildcard, so the symbol
          # package sitting beside it can never be picked by ordering luck.
          $pkg = Get-ChildItem artifacts -File |
                 Where-Object Extension -eq '.nupkg' |
                 Select-Object -First 1
          if (-not $pkg) { throw 'No .nupkg produced' }
          Write-Host "Inspecting $($pkg.Name)"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            $names = $zip.Entries.FullName
            $names | Sort-Object | ForEach-Object { Write-Host "  $_" }

            $managed = $names | Where-Object { $_ -like 'lib/*/WinDevicesNet.dll' }
            $native  = $names | Where-Object { $_ -eq 'runtimes/win-x64/native/WinDevices.dll' }

            if (-not $managed) { throw 'Package is missing lib/<tfm>/WinDevicesNet.dll' }
            if (-not $native)  { throw 'Package is missing runtimes/win-x64/native/WinDevices.dll' }
          }
          finally {
            $zip.Dispose()
          }
          Write-Host 'Package layout OK'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*

      # Trusted Publishing, not a stored API key. nuget.org verifies the
      # OIDC token issued to this workflow and returns a short-lived key,
      # so nothing long-lived is kept in repository secrets.
      #
      # This requires a Trusted Publisher policy registered on nuget.org
      # against owner TorinKS, repository WinDeviceslib and workflow file
      # publish-nuget.yaml. Renaming this file invalidates that policy.
      - name: NuGet login (Trusted Publishing)
        if: steps.gate.outputs.publish == 'true'
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          TEMP_NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if (-not $env:TEMP_NUGET_KEY) {
            throw 'Trusted Publishing returned no key. Check that the repository variable NUGET_USER is set and that a Trusted Publisher policy for TorinKS/WinDeviceslib + publish-nuget.yaml exists on nuget.org.'
          }

          # Resolve the package explicitly. A quoted wildcard reaches dotnet
          # verbatim and is not expanded, which fails as
          # "File does not exist (artifacts/*.nupkg)".
          $pkg = Get-ChildItem artifacts -File |
                 Where-Object Extension -eq '.nupkg' |
                 Select-Object -First 1
          if (-not $pkg) { throw 'No .nupkg found in artifacts/ to push.' }
          Write-Host "Pushing $($pkg.Name)"

          # The matching .snupkg beside it is picked up and pushed by NuGet
          # automatically; it must not be pushed as a package in its own right.
          dotnet nuget push $pkg.FullName `
            --api-key $env:TEMP_NUGET_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
